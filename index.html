<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; background: #f4f1ea; }
    h1 { color: #8a3b12; }
  </style>
</head>
<body>
    
    <!-- Form -->
    <h2>Ready to Play?</h2>
    <form action="index.html">
      <p>
        <label>Your name:</label><br>
        <input type="text" name="name">
      </p>

      <p>
        <label>Who are you?</label><br>
        <input type="text" name="who">
      </p>

      <p>Are you ready to play the game?</p>
      <input type="radio" name="ready" value="yes"> Yes<br>
      <input type="radio" name="ready" value="no"> Not yet<br>

      <p><button type="submit">Send</button></p>
    </form>
  </main>

  <footer>
    <p><small>Thanks for visiting!</small></p>
  </footer>
</body>
</html>
